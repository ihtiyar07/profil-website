<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Base background (blueprint dark) -->
  <rect width="64" height="64" rx="8" fill="#0A0F1D" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="6.5" stroke="#1E293B" stroke-width="1.5" />
  
  <!-- Data Bus Line (connecting stops) -->
  <line x1="12" y1="32" x2="52" y2="32" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  
  <!-- Left station (Sensor/MCU) -->
  <circle cx="18" cy="32" r="4.5" fill="#0A0F1D" stroke="#0284C7" stroke-width="2" />
  
  <!-- Central data packet (accent) -->
  <circle cx="32" cy="32" r="5" fill="#38BDF8" />
  
  <!-- Right station (Signed delivery) -->
  <circle cx="46" cy="32" r="4.5" fill="#0A0F1D" stroke="#F1F5F9" stroke-width="2" />
  
  <!-- Subtle top/bottom telemetry ticks -->
  <line x1="32" y1="16" x2="32" y2="24" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="32" y1="40" x2="32" y2="48" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />
</svg>